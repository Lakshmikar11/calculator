<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
    </head>
    <body>
        <div class="container">
            <div class="display">
                <input type="text" id="display" style="height: 50px; width: 100px;">

            </div>
            <div class="buttons">
                <table>
                    <tr>
                        <td><button>0</button></td>
                        <td><button>-</button></td>
                        <td><button>+</button></td>
                        <td><button>*</button></td>
                    </tr>
                    <tr>
                        <td><button>7</button></td>
                        <td><button>8</button></td>
                        <td><button>9</button></td>
                        <td><button>/</button></td>
                    </tr>
                    <tr>
                        <td><button>4</button></td>
                        <td><button>5</button></td>
                        <td><button>6</button></td>
                        <td><button>=</button></td>
                    </tr>
                    <tr>
                        <td><button>1</button></td>
                        <td><button>2</button></td>
                        <td><button>3</button></td>
                    </tr>
                </table>

            </div>
        </div>
    </body>
</html>
